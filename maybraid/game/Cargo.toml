[package]
name = "maybraid"
version = { workspace = true }
edition  = { workspace = true }
license  = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
publish = { workspace = true }
rust-version = { workspace = true }

[[bin]]
name = "maybraid"
path = "src/main.rs"

[dependencies]
chico = { workspace = true }
vegetation-persistent-diagnostics = { workspace = true, optional = true }
lubikans = { workspace = true }
layer-stack = { workspace = true }
bevy = { workspace = true }
clap = { workspace = true }
character-model-user = { workspace = true }
characters-playground = { workspace = true }
character-inventory-user = { workspace = true }
maybraid-character-controller = { workspace = true }
maybraid-game-mode-discover = { workspace = true }
maybraid-game-mode-reliquary = { workspace = true }
maybraid-virtual-pad-controller = { workspace = true }
maybraid-agent = { workspace = true }
maybraid-menu-controller = { workspace = true }
maybraid-gameplay = { workspace = true }
maybraid-controllers-core = { workspace = true }
maybraid-session = { workspace = true }
maybraid-sky = { workspace = true }
lod = { workspace = true }
maybraid-world = { workspace = true }
menu-components = { workspace = true }
menu-playground = { workspace = true }
menu-screens = { workspace = true }
character-persist = { workspace = true }

[features]
persistent-vegetation-fixture = ["chico/persistent-vegetation-fixture"]
persistent-vegetation-diagnostics = ["persistent-vegetation-fixture", "dep:vegetation-persistent-diagnostics"]
debug-commands = ["maybraid-world/debug-commands"]

[dev-dependencies]
anyhow = { workspace = true }
character-items = { workspace = true }
characters = { workspace = true }
maybraid-world = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }

[lints]
workspace = true
