[package]
name = "maybraid-language"
version = { workspace = true }
edition  = { workspace = true }
license  = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
publish = { workspace = true }
rust-version = { workspace = true }

[[bin]]
name = "maybraid-language"
path = "src/main.rs"

[features]
default = []
metal = ["maybraid-language-mistral/metal"]
cuda = ["maybraid-language-mistral/cuda"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
maybraid-language-core = { workspace = true }
maybraid-language-mistral = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
maybraid-language-mistral = { workspace = true, features = ["metal"] }

[lints]
workspace = true
