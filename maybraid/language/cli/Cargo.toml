[package]
name = "maybraid-language"
version = { workspace = true }
edition  = { workspace = true }
license  = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
publish = { workspace = true }
rust-version = { workspace = true }

[[bin]]
name = "maybraid-language"
path = "src/main.rs"

[features]
default = []
# `--respond` (mistral.rs). Default-off so workspace `cargo check` on Linux CI skips the LLM graph.
llm = ["dep:maybraid-language-mistral"]
metal = ["llm", "maybraid-language-mistral/metal"]
cuda = ["llm", "maybraid-language-mistral/cuda"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
maybraid-language-core = { workspace = true }
maybraid-language-mistral = { workspace = true, optional = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
