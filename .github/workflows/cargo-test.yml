# This workflow runs cargo test on every pushed commit, including main.
# Main pushes must keep running: rust-cache only saves on main, and PR
# jobs restore that entry.

name: Cargo Test

on:
  push:
    branches:

jobs:
  cargo-test:
    uses: ./.github/workflows/nix-command.yml
    with:
      command: cargo test --release --locked
      nix_flake_path: '.'
      runner: 'ubuntu-24.04'
      rust_cache_key: cargo-release-test

  diagnostic-tests:
    uses: ./.github/workflows/nix-command.yml
    with:
      # Default workspace tests do not compile the world memory snapshot or
      # retirement successor readout. Exercise their real opt-in feature path.
      command: cargo test --release --locked -p lod -p maybraid-world --features lod/generation-tracing,maybraid-world/memory-census --lib
      nix_flake_path: '.'
      runner: 'ubuntu-24.04'
      rust_cache_key: cargo-release-test
