# Unsigned packages: macOS DMG, Windows zip, Steam depot, AppImage.
# Linux compiles once in the pinned sniper image, then packages twice.
# Trigger: main, published release, workflow_dispatch, ci-action::package.

name: Package

on:
  push:
    branches:
      - '**'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: package-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: write

jobs:
  version:
    if: >
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.message, 'ci-action::package')
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "version=$(packaging/version.sh)" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p target/sniper-release
      - uses: actions/cache@v4
        with:
          path: target/sniper-release
          key: sniper-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml', 'packaging/linux/**') }}
      - run: packaging/scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary-${{ needs.version.outputs.version }}
          path: target/sniper-release/x86_64-unknown-linux-gnu/release/maybraid
          retention-days: 1

  package-linux:
    needs: [version, build-linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      matrix:
        format: [steam, appimage]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-binary-${{ needs.version.outputs.version }}
          path: target/sniper-release/x86_64-unknown-linux-gnu/release/
      - run: chmod +x target/sniper-release/x86_64-unknown-linux-gnu/release/maybraid
      - if: matrix.format == 'steam'
        run: packaging/scripts/package-steam.sh
      - if: matrix.format == 'appimage'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: packaging/scripts/package-appimage.sh
      - if: matrix.format == 'steam'
        uses: actions/upload-artifact@v4
        with:
          name: maybraid-${{ needs.version.outputs.version }}-steam-linux-x64
          path: dist/*.tar.xz
          if-no-files-found: error
          retention-days: 14
      - if: matrix.format == 'appimage'
        uses: actions/upload-artifact@v4
        with:
          name: maybraid-${{ needs.version.outputs.version }}-linux-x64-appimage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 14
      - if: matrix.format == 'steam'
        run: packaging/smoke.sh dist/Maybraid-${{ needs.version.outputs.version }}-steam-linux-x64/maybraid
      - if: matrix.format == 'appimage'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: packaging/smoke.sh dist/Maybraid-${{ needs.version.outputs.version }}-linux-x64.AppImage

  package-macos:
    needs: version
    runs-on: macos-14
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build with Crane + selected Xcode
        run: |
          xcodebuild -version
          nix build .#maybraid-macos --impure --option sandbox false -L
      - run: BINARY=result/bin/maybraid packaging/scripts/package-macos.sh
      - run: packaging/validate.sh macho dist/Maybraid.app/Contents/MacOS/maybraid
      - run: packaging/smoke.sh dist/Maybraid.app/Contents/MacOS/maybraid
      - uses: actions/upload-artifact@v4
        with:
          name: maybraid-${{ needs.version.outputs.version }}-macos-arm64
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  package-windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: rust
        shell: bash
        run: echo "channel=$(packaging/version.sh --rust)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
      - shell: bash
        run: cargo build -p maybraid --release --locked --target x86_64-pc-windows-msvc
      - shell: bash
        run: packaging/scripts/package-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: maybraid-${{ needs.version.outputs.version }}-windows-x64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: github.event_name == 'release'
    needs: [build-linux, package-linux, package-macos, package-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: maybraid-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/*.{dmg,zip,tar.xz,AppImage} --clobber
