# Game packages: macOS ARM64 DMG, Windows x64 zip, Linux Steam + AppImage.
# Release entry points: flake shells (macOS/Windows) and build-linux-sniper.sh.
# Artifacts on main / ci-action::package / workflow_dispatch.
# GitHub Release assets only when a release is published.
#
# Push is branch-only so creating a tag does not start a second run that
# shares a ref with `release` and cancels the upload (v0.1.0-playtest-001).
# Concurrency is also keyed by event so a later push cannot cancel a release.

name: Package

on:
  push:
    branches:
      - '**'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: package-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: write

jobs:
  # One sniper-SDK binary, reused by Steam and AppImage packaging.
  build-linux-sniper:
    if: >
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.message, 'ci-action::package')
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          workspace_version=$(awk '
            $0 == "[workspace.package]" { hit = 1; next }
            hit && /^\[/ { exit }
            hit && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)
          if [ -z "$workspace_version" ]; then
            echo "could not read workspace.package.version from Cargo.toml" >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "release" ]; then
            v="${{ github.event.release.tag_name }}"
            v="${v#v}"
          else
            v="${workspace_version}-${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Prepare sniper cache directory
        run: mkdir -p target/sniper-release

      - uses: actions/cache@v4
        with:
          path: target/sniper-release
          key: sniper-release-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            sniper-release-

      - name: Build with Steam Runtime sniper SDK
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: packaging/scripts/build-linux-sniper.sh

      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary-${{ steps.ver.outputs.version }}
          path: target/sniper-release/x86_64-unknown-linux-gnu/release/maybraid
          retention-days: 1

  package-linux:
    needs: build-linux-sniper
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      matrix:
        format: [steam, appimage]
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          workspace_version=$(awk '
            $0 == "[workspace.package]" { hit = 1; next }
            hit && /^\[/ { exit }
            hit && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)
          if [ -z "$workspace_version" ]; then
            echo "could not read workspace.package.version from Cargo.toml" >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "release" ]; then
            v="${{ github.event.release.tag_name }}"
            v="${v#v}"
          else
            v="${workspace_version}-${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: linux-binary-${{ steps.ver.outputs.version }}
          path: target/sniper-release/x86_64-unknown-linux-gnu/release/

      - name: Restore binary permissions
        run: chmod +x target/sniper-release/x86_64-unknown-linux-gnu/release/maybraid

      - name: Package Steam depot
        if: matrix.format == 'steam'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: packaging/scripts/package-steam.sh

      - name: Package AppImage
        if: matrix.format == 'appimage'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          sudo apt-get update && sudo apt-get install -y desktop-file-utils libfuse2
          packaging/scripts/package-appimage.sh

      - name: Upload Steam package
        if: matrix.format == 'steam'
        uses: actions/upload-artifact@v4
        with:
          name: maybraid-${{ steps.ver.outputs.version }}-steam-linux-x64
          path: dist/*.tar.xz
          if-no-files-found: error
          retention-days: 14

      - name: Upload AppImage
        if: matrix.format == 'appimage'
        uses: actions/upload-artifact@v4
        with:
          name: maybraid-${{ steps.ver.outputs.version }}-linux-x64-appimage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

  package-macos:
    if: >
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.message, 'ci-action::package')
    runs-on: macos-14
    timeout-minutes: 180
    env:
      CARGO_TARGET_DIR: target/release-packaging
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          workspace_version=$(awk '
            $0 == "[workspace.package]" { hit = 1; next }
            hit && /^\[/ { exit }
            hit && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)
          if [ -z "$workspace_version" ]; then
            echo "could not read workspace.package.version from Cargo.toml" >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "release" ]; then
            v="${{ github.event.release.tag_name }}"
            v="${v#v}"
          else
            v="${workspace_version}-${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Enable Nix Flakes
        run: |
          mkdir -p ~/.config/nix
          echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf

      - name: Prepare release target directory
        run: mkdir -p target/release-packaging

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release-macos
          workspaces: ". -> target/release-packaging"
          key: macos-arm64-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Package macOS with release-macos shell
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: nix develop .#release-macos --command packaging/scripts/package-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: maybraid-${{ steps.ver.outputs.version }}-macos-arm64
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  package-windows:
    if: >
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.message, 'ci-action::package')
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: target/release-packaging
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        shell: bash
        run: |
          workspace_version=$(awk '
            $0 == "[workspace.package]" { hit = 1; next }
            hit && /^\[/ { exit }
            hit && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)
          if [ -z "$workspace_version" ]; then
            echo "could not read workspace.package.version from Cargo.toml" >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "release" ]; then
            v="${{ github.event.release.tag_name }}"
            v="${v#v}"
          else
            v="${workspace_version}-${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          targets: x86_64-pc-windows-msvc

      - name: Prepare release target directory
        shell: bash
        run: mkdir -p target/release-packaging

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release-windows
          workspaces: ". -> target/release-packaging"
          key: windows-x64-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Package Windows
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          CARGO_TARGET_DIR: target/release-packaging
        run: packaging/scripts/package-windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: maybraid-${{ steps.ver.outputs.version }}-windows-x64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: github.event_name == 'release'
    needs: [build-linux-sniper, package-linux, package-macos, package-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: maybraid-*
          merge-multiple: true
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -lh artifacts/
          gh release upload "${{ github.event.release.tag_name }}" artifacts/*.{dmg,zip,tar.xz,AppImage} --clobber
